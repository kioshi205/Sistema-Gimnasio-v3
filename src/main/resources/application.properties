
# ==========================================
# 1. IDENTIDAD DE LA APLICACIÓN
# ==========================================

spring.application.name=SistemaGimnasioV2

# Puerto donde se ejecutará el servidor web
server.port=8080


# ==========================================
# 2. CONFIGURACIÓN DE LAS VISTAS JSP
# ==========================================

# Carpeta donde Spring buscará las vistas JSP
spring.mvc.view.prefix=/WEB-INF/views/

# Extensión de las vistas
spring.mvc.view.suffix=.jsp


# ==========================================
# 3. CONFIGURACIÓN DE H2
# ==========================================

# Base de datos en memoria.
# Se crea al iniciar la aplicación.
spring.datasource.url=jdbc:h2:mem:gimnasioV2

# Usuario y contraseña de H2
spring.datasource.username=sa
spring.datasource.password=

# Controlador JDBC de H2
spring.datasource.driver-class-name=org.h2.Driver

# ==================================================
# 4. BASE DE DATOS: MYSQL / MARIADB (ETAPA FUTURA)
# ==================================================

# Cuando migres a XAMPP:
# 1. Inicia MySQL/MariaDB desde el panel de XAMPP.
# 2. Crea la base de datos gimnasio.
# 3. Configura las credenciales.
# 4. Desactiva las propiedades de H2.
# 5. Activa las propiedades siguientes quitando el #.

# spring.datasource.url=jdbc:mysql://localhost:3306/gimnasio
# spring.datasource.username=root
# spring.datasource.password=TU_CONTRASEÑA
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# 5. INICIALIZACIÓN DE LA BASE DE DATOS
# ==========================================

# Ejecutar schema.sql y data.sql al iniciar
spring.sql.init.mode=always

# Codificación de los scripts SQL
spring.sql.init.encoding=UTF-8


# ==========================================
# 6. CODIFICACIÓN DE CARACTERES
# ==========================================

# Evitar problemas con tildes y caracteres especiales
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


